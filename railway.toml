# Prefer Dockerfile so monorepo + prisma + argon2 build reliably.
# Migrations run at container start (DB is reachable then), not at image build.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
