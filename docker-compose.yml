services:
  postgres:
    image: postgres:16-alpine
    container_name: leadpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leadpilot
    ports:
      - "5432:5432"
    volumes:
      - leadpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: leadpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - leadpilot_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  leadpilot_pgdata:
  leadpilot_redisdata:
